# Настройки сервиса маскирования персональных данных.
# Файл применяется без перезапуска: отправьте сервису сигнал SIGHUP либо
# просто сохраните файл — сервис заметит изменение в течение пяти секунд.
# Настройки, не прошедшие проверку, отбрасываются, сервис продолжает работать
# со старыми.

server:
  http: ":8080"
  https: ":8443"
  max_body_bytes: 4194304
  read_header_timeout: 5s
  read_timeout: 15s
  # Общий срок записи ответа. Девять секунд короче десятисекундного таймаута
  # проверяющей системы, поэтому обрыв остаётся решением сервиса, а не клиента.
  #
  # На пути прокси к языковой модели этот срок был бы перевёрнут: модель по
  # настройкам отвечает до 60 секунд, и ответ, пришедший на десятой, записать
  # клиенту было бы уже нечем. Поэтому обработчик /v1/chat/completions
  # продлевает срок записи на своём соединении через http.ResponseController,
  # не трогая общий срок сервера. Обе цепочки получаются согласованными:
  #
  # | Величина | Цепочка /process | Цепочка /v1/chat/completions |
  # |---|---|---|
  # | Таймаут клиента | 10 с, проверяющая система | задаёт вызывающий |
  # | Срок чтения запроса | 15 с | 15 с |
  # | Ожидание места в ограничителе | 0.5 с | 0.5 с |
  # | Ожидание ответа модели | нет обращения | 60 с, upstream.timeout |
  # | Срок записи ответа | 9 с, общий | 65 с, продлён на соединении |
  # | Пауза перед закрытием приёма | 7 с | 7 с |
  # | Предел завершения | 15 с | 15 с, ответ модели не переживёт остановку |
  write_timeout: 9s
  idle_timeout: 90s
  shutdown_timeout: 15s
  # Пауза между снятием готовности и закрытием приёма. Балансировщик узнаёт о
  # снятии готовности за 5 секунд (период проверки 2 с, порог 2 неудачи,
  # предел ожидания 1 с) и всё это время продолжает слать запросы. Плюс
  # 2 секунды запаса на разброс проверок. Прерывается вторым сигналом
  # остановки. Расчёт — docs/BALANCING.md, мягкий вывод копии из обслуживания.
  drain_timeout: 7s

limits:
  # Ограничители — предохранители, а не регуляторы: на штатной нагрузке
  # до отказа с просьбой повторить доходить не должно.
  inflight: 96
  heavy_inflight: 6
  heavy_threshold_bytes: 65536
  max_wait: 500ms

store:
  # Срок жизни записи и предел их числа должны быть согласованы, иначе
  # настоящий срок жизни задаёт предел, а не настройка. Предел в миллион
  # записей при плановой тысяче запросов в секунду набирается за 16.7 минуты,
  # поэтому объявленные 60 минут были обещанием, которого хранилище не
  # выполняло: записи вытеснялись втрое с половиной раньше срока, молча.
  #
  # Приведено к согласию сокращением срока жизни, а не поднятием предела:
  #
  # | Срок жизни | Записей при 1000 в секунду | Память по 3 КБ на запись |
  # |---|---|---|
  # | 15 мин | 0.90 млн | 2.7 ГБ |
  # | 60 мин | 3.60 млн | 10.8 ГБ |
  #
  # Час стоил бы 3.6 миллиона записей и 10.8 гигабайта против 48 гигабайт
  # машины: помещается, но четверть памяти уходит на соответствия, которые
  # никто не спросит. Пятнадцати минут хватает с запасом: проверяющая система
  # просит обратное преобразование сразу, а весь контрактный прогон длится
  # пять минут и даёт 300 тысяч записей. Предел в миллион при этом остаётся
  # предохранителем: он срабатывает только если частота втрое превысит
  # плановую.
  ttl: 15m
  max_records: 1000000
  key_env: PII_STORE_KEY
  # Снимать ли готовность, когда общее хранилище недоступно и сервис перешёл
  # на память процесса. По умолчанию нет, и это щадящее поведение выбрано
  # сознательно: на одной копии память процесса это полноценный запасной
  # путь, маску делает и разворачивает одна и та же копия, ответы остаются
  # верными, и работать лучше, чем не работать.
  #
  # В группе копий всё наоборот: маску сделала одна копия, обратное
  # преобразование просит другая, и записи она не найдёт. Ответ будет
  # двухсотым и при этом неверным, а тихо неверный ответ хуже отказа. При
  # включении общего хранилища и второй копии признак включают.
  unready_on_degraded: false

defaults:
  preset: full
  on_error: closed
  on_unknown_id: "404"
  min_confidence: 0.6
  # Контекстные правила по умолчанию выключены: одиночный пин-код должен
  # маскироваться, иначе он уйдёт в языковую модель открытым текстом.
  context_rules_enabled: false
  date_without_anchor: pii_context
  # Ручка разбора текста: показывает, какое правило сработало и почему.
  # Нужна для проверки; в промышленной установке оставляют служебным системам.
  inspect_enabled: true

# Журнал. Те же значения задаются переменными окружения PII_LOG_*, и окружение
# важнее файла: файл лежит в образе и описывает установку, окружение правится
# на машине. Подробности — docs/LOGGING.md.
logging:
  level: info
  format: json
  # Второй рубеж защиты от утечки: значения проверяются перед записью.
  # Выключается только в измерениях скорости.
  redact: true
  # Одинаковая запись уровня warn и выше выводится не чаще раза в окно,
  # остальные считаются. Защита от шторма ошибок.
  repeat_window: 10s
  repeat_level: warn
  # Прореживание записей об успешных запросах: пишется каждый N-й. Отказы,
  # ошибки и запросы медленнее slow пишутся всегда, поэтому прореживание
  # убирает только однообразное.
  #
  # Расчёт коэффициента. Цель около 20 записей в секунду: при ней дисковый
  # бюджет в 8 гигабайт держится две недели. Отсюда N равно потоку запросов,
  # делённому на двадцать:
  #
  # | Запросов в секунду | N | Записей в секунду | ГБ в сутки | 8 ГБ хватит на |
  # |---|---|---|---|---|
  # | до 20 | 1 | столько же | до 0.58 | от 13.9 суток |
  # | 1 000, штатный прогон | 50 | 20 | 0.58 | 13.9 суток |
  # | 23 200, потолок | 1000 | 23 | 0.67 | 12.0 суток |
  #
  # Без прореживания потолок дал бы 667 гигабайт в сутки и съел бы бюджет за
  # 17 минут.
  #
  # Взято значение для штатного прогона. Полнота следа от этого не страдает:
  # каждое обращение к персональным данным целиком лежит в журнале аудита,
  # который не прореживается никогда, а прореживание убирает только вторую,
  # почти такую же запись в обычном журнале. Замер это подтверждает: при
  # sample_n равном единице сквозной прогон на тексте 250 байт терял 7.5
  # процента частоты на второй записи, при 50 потеря укладывается в
  # погрешность.
  sample_n: 50
  # Запрос медленнее порога пишется вопреки прореживанию: терять надо скучное,
  # а не интересное. Доля 99 штатной нагрузки равна 0.97 мс, так что порог
  # срабатывает только на настоящих задержках.
  slow: 250ms
  audit:
    # Отдельный журнал обращений к персональным данным: кто, когда, какой
    # системой, сколько фрагментов какого типа. Значений в записи нет.
    enabled: true
    # Пустой путь означает общий поток вывода; записи аудита отличаются полем
    # stream. На машине путь задают переменной PII_AUDIT_PATH.
    path: ""
    max_bytes: 268435456
    keep: 8

systems:
  # Профиль проверяющей системы: она не передаёт заголовков, поэтому работает
  # без ключа. Единственная система без ключа, это проверяет валидатор.
  alfasonar:
    enabled: true
    auth: none
    types: [all]
    demask: true
    preset: full
    on_error: open
    on_unknown_id: passthrough
    min_confidence: 0.5
    exclusions:
      # Исторические лица и адреса организаций персональными данными не являются.
      public_figures: true
      org_addresses: true

  # Цепочка «среда разработки — модуль — языковая модель».
  kilo:
    enabled: true
    auth:
      header: X-System-Key
      key_sha256: "${KILO_KEY_SHA256}"
    types: [all]
    demask: true
    # Плейсхолдер переживает ответ модели, звёздочки и инициалы — нет.
    preset: token
    exclusions:
      # Исторические лица и адреса организаций персональными данными не являются.
      public_figures: true
      org_addresses: true
    upstream:
      # Адрес принимается в любой из трёх форм, суффикс ручки чата
      # дописывается сам: базовый адрес площадки, он же с версией, либо
      # сразу полный путь ручки. Раньше полный путь удваивался, и модель
      # отвечала кодом 401 с пустым телом.
      url: "${ALFAGEN_URL}"
      token_env: ALFAGEN_TOKEN
      model: deepseek-ai/DeepSeek-V4-Flash-0731
      timeout: 60s
      # Сертификат модели подписан удостоверяющим центром, которого нет ни в
      # системном хранилище, ни в открытом доступе: центр называется так же,
      # как опубликованный «Russian Trusted Sub CA», но ключ у него другой,
      # и сервер не присылает промежуточный сертификат. Поэтому подлинность
      # проверяется закреплённым отпечатком открытого ключа: принимается
      # ровно один ключ.
      #
      # Отпечаток снимается с машины, откуда сервис реально ходит к модели.
      # С ноутбука разработчика адрес недоступен, и команда вернёт отпечаток
      # пустой строки, а не сервера. Пересчёт:
      #
      #   openssl s_client -connect alfagen.alfabank.ru:443 \
      #     -servername alfagen.alfabank.ru </dev/null 2>/dev/null \
      #     | openssl x509 -pubkey -noout \
      #     | openssl pkey -pubin -outform der \
      #     | openssl dgst -sha256 -binary | openssl enc -base64
      #
      # Значение ниже снято со стенда 22.09.2026, сертификат действует до
      # 01.09.2027. Не совпал отпечаток — сервис отвечает кодом 502 и пишет
      # в журнал, какой отпечаток он увидел.
      pin_sha256: "sWL5E7cHOl9ZX9vIVtwyNSDUXbcEl6FMYjoCijGMFFY="

  # Профиль для показа жюри: маска читаемая, видно структуру текста.
  jury_demo:
    enabled: true
    auth:
      header: X-System-Key
      key_sha256: "${JURY_KEY_SHA256}"
    types: [all]
    demask: true
    preset: partial
    per_type:
      FIO: initials
      CARDHOLDER: initials
    exclusions:
      # Исторические лица и адреса организаций персональными данными не являются.
      public_figures: true
      org_addresses: true

  # Профиль, которому демаскирование запрещено: показывает, что обратное
  # преобразование доступно только настроенной системе.
  jury_nodemask:
    enabled: true
    auth:
      header: X-System-Key
      key_sha256: "${JURY2_KEY_SHA256}"
    types: [all]
    demask: false
    preset: partial
    exclusions:
      # Исторические лица и адреса организаций персональными данными не являются.
      public_figures: true
      org_addresses: true

# Новый тип персональных данных добавляется здесь, без правки кода.
custom_types:
  - name: SNILS
    pattern: '(\d{3}-\d{3}-\d{3}[ -]?\d{2})'
    group: 1
    validator: snils
    anchors: ["снилс", "страховой номер"]
    require_anchor: false
