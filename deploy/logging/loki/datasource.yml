# Источник данных Loki для Grafana. Кладётся рядом с описанием источника
# Prometheus: deploy/grafana/datasources/loki.yml.
#
# Ставится только вместе с необязательным слоем Loki.
apiVersion: 1

datasources:
  - name: Loki
    type: loki
    uid: pii-loki
    access: proxy
    url: http://loki:3100
    isDefault: false
    jsonData:
      maxLines: 2000
      # Переход от записи журнала к трассировке по идентификатору запроса.
      derivedFields:
        - name: request_id
          matcherRegex: '"request_id":"([^"]+)"'
          url: '/explore?left={"queries":[{"expr":"{job=\"pii-guard\"} |= \"$${__value.raw}\""}]}'
