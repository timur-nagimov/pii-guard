# Настройка journald для стенда pii-guard.
# Кладётся в /etc/systemd/journald.conf.d/pii-guard.conf.
#
# Зачем этот файл. У journald по умолчанию включён собственный ограничитель
# частоты: не больше 10000 сообщений за 30 секунд на службу, остальное
# отбрасывается молча. Наш сервис на потолке нагрузки выдаёт больше, и без
# этой настройки журнал теряется именно тогда, когда он нужен. Прореживание
# и глушение повторов сервис делает сам и осознанно, поэтому второй
# ограничитель здесь только вредит.
[Journal]
# Журнал переживает перезагрузку: разбор отказа обычно начинается после неё.
Storage=persistent
Compress=yes
Seal=no

# Предел места. Диск машины 60 ГБ, под журнал отдано 8 ГБ, и ещё 10 ГБ
# journald обязан оставить свободными под всё остальное.
SystemMaxUse=8G
SystemKeepFree=10G
SystemMaxFileSize=512M
SystemMaxFiles=16

# Срок хранения обычного журнала. Разбор происшествия укладывается в две
# недели; всё, что нужно хранить дольше, идёт в журнал аудита.
MaxRetentionSec=14day

# Собственный ограничитель journald выключен, смотри пояснение выше.
RateLimitIntervalSec=0
RateLimitBurst=0

# Дублирование в syslog и на консоль выключено: это лишняя запись на диск и
# лишняя работа на каждой строке.
ForwardToSyslog=no
ForwardToWall=no
ForwardToConsole=no
