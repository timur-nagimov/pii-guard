# Дополнение к службе pii-guard, отвечающее за журнал.
# Кладётся в /etc/systemd/system/pii-guard.service.d/logging.conf.
#
# Основной файл службы не меняется: дополнение добавляется рядом, поэтому
# обновление сервиса не затирает настройки журнала и наоборот.
[Service]
# Журнал пишется в стандартный вывод и подхватывается journald.
StandardOutput=journal
StandardError=journal
SyslogIdentifier=pii-guard

# Ограничитель journald для этой службы выключен, смотри journald.conf.
LogRateLimitIntervalSec=0
LogRateLimitBurst=0

# Каталог журнала аудита создаёт systemd: права 0750, владелец совпадает с
# пользователем службы. Ручное создание каталога не нужно.
LogsDirectory=pii-guard
LogsDirectoryMode=0750

# Уровень и формат. Уровень меняется на ходу через ручку управления, здесь
# задано значение при запуске.
Environment=PII_LOG_LEVEL=info
Environment=PII_LOG_FORMAT=json
Environment=PII_LOG_SOURCE=0
Environment=PII_LOG_REDACT=1
Environment=PII_LOG_REPEAT_WINDOW=10s
Environment=PII_LOG_REPEAT_LEVEL=warn

# Прореживание записей об успешных запросах. Единица означает, что пишутся
# все: на стенде поток невелик и полный журнал нагляднее. Как выбрать
# значение под свою нагрузку, смотри расчёт объёма в docs/LOGGING.md.
Environment=PII_LOG_SAMPLE=1
Environment=PII_LOG_SLOW=250ms

# Имя копии сервиса попадает в каждую запись и разделяет копии в общем
# хранилище журнала так же, как метка instance разделяет их в показателях.
Environment=PII_INSTANCE=%H

# Журнал аудита: отдельный файл, ротация по размеру силами сервиса.
Environment=PII_AUDIT=1
Environment=PII_AUDIT_PATH=/var/log/pii-guard/audit.log
Environment=PII_AUDIT_MAX_BYTES=268435456
Environment=PII_AUDIT_KEEP=8
