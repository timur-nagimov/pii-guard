#cloud-config
users:
  - name: ubuntu
    groups: [sudo]
    shell: /bin/bash
    sudo: ['ALL=(ALL) NOPASSWD:ALL']
write_files:
  - path: /etc/sysctl.d/99-highload.conf
    content: |
      net.core.somaxconn = 65535
      net.core.netdev_max_backlog = 65535
      net.ipv4.tcp_max_syn_backlog = 65535
      net.ipv4.ip_local_port_range = 1024 65535
      net.ipv4.tcp_tw_reuse = 1
      net.ipv4.tcp_fin_timeout = 15
      fs.file-max = 2097152
  - path: /etc/security/limits.d/99-nofile.conf
    content: |
      *  soft  nofile  1048576
      *  hard  nofile  1048576
package_update: true
packages: [docker.io, docker-compose-v2, make, git, jq, htop, unzip, ca-certificates, curl]
runcmd:
  - sysctl --system
  - systemctl enable --now docker
  - usermod -aG docker ubuntu
  - echo 'STAND=app ready' > /var/log/stand-ready
